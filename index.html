<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Space Shooter Test</title>

<style>
body{
margin:0;
background:#020617;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

canvas{
background:#020617;
display:block;
margin:auto;
}

#info{
position:fixed;
top:5px;
left:0;
width:100%;
z-index:5;
font-weight:bold;
}
</style>
</head>

<body>

<div id="info">
Score: <span id="score">0</span>
<br>
POWER-UPS APPEAR EVERY FEW SECONDS
</div>

<canvas id="game" width="400" height="700"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let score=0;
let enemies=[];
let powerups=[];
let timer=0;

function enemy(){

let type=Math.floor(Math.random()*3);

let colors=["red","purple","orange"];
let sizes=[20,30,40];

enemies.push({
x:50+Math.random()*300,
y:-40,
size:sizes[type],
color:colors[type],
speed:1+Math.random()*2
});

}

function powerup(){

let types=[
{symbol:"⚡",color:"yellow"},
{symbol:"🛡️",color:"cyan"},
{symbol:"💥",color:"orange"},
{symbol:"❤️",color:"lime"}
];

let p=types[Math.floor(Math.random()*types.length)];

powerups.push({
x:50+Math.random()*300,
y:-30,
symbol:p.symbol,
color:p.color,
speed:2
});

}

function update(){

timer++;

if(timer%60===0){
enemy();
}

if(timer%180===0){
powerup();
}

for(let e of enemies){
e.y+=e.speed;
}

for(let p of powerups){
p.y+=p.speed;
}

}

function draw(){

ctx.clearRect(0,0,400,700);

for(let e of enemies){

ctx.fillStyle=e.color;

ctx.beginPath();
ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
ctx.fill();

}

ctx.font="30px Arial";
ctx.textAlign="center";

for(let p of powerups){

ctx.fillStyle=p.color;
ctx.fillText(p.symbol,p.x,p.y);

}

}

function loop(){

update();
draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
