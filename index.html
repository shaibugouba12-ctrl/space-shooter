<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Space Shooter</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#020617;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
touch-action:none
}
canvas{
display:block;
margin:auto;
background:#020617;
max-width:100vw;
max-height:100vh
}
#hud{
position:fixed;
top:10px;
left:0;
width:100%;
display:flex;
justify-content:space-around;
font-size:15px;
font-weight:bold;
z-index:5;
pointer-events:none
}
#screen{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:rgba(0,0,20,.82);
z-index:10;
text-align:center
}
#screen h1{font-size:38px;margin:10px}
#screen p{font-size:17px}
button{
border:0;
border-radius:12px;
padding:14px 25px;
margin:7px;
font-size:18px;
font-weight:bold;
background:#2563eb;
color:white
}
.controls{
position:fixed;
bottom:18px;
left:0;
width:100%;
display:flex;
justify-content:space-around;
z-index:6
}
.control{
width:75px;
height:55px;
font-size:25px;
opacity:.85
}
#power{
position:fixed;
top:48px;
left:0;
width:100%;
text-align:center;
font-weight:bold;
font-size:14px;
z-index:5;
pointer-events:none
}
</style>
</head>

<body>

<div id="hud">
<div>❤️ <span id="lives">3</span></div>
<div>🏆 <span id="score">0</span></div>
<div>🪙 <span id="coins">0</span></div>
<div>⭐ L<span id="level">1</span></div>
</div>

<div id="power"></div>

<canvas id="game"></canvas>

<div id="screen">
<h1>🚀 SPACE SHOOTER</h1>
<p>Destroy enemies. Collect coins. Grab power-ups!</p>
<button onclick="startGame()">START GAME</button>
</div>

<div class="controls">
<button class="control" id="left">⬅️</button>
<button class="control" id="fire">🔥</button>
<button class="control" id="right">➡️</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=400;
canvas.height=700;

let player;
let bullets=[];
let enemies=[];
let coins=[];
let powerups=[];
let stars=[];
let particles=[];

let score=0;
let coinCount=0;
let lives=3;
let level=1;

let running=false;
let firing=false;

let rapidFire=0;
let shield=0;
let megaShot=0;

let lastShot=0;
let enemyTimer=0;
let coinTimer=0;
let powerTimer=0;

for(let i=0;i<90;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
speed:1+Math.random()*3,
size:Math.random()*2+1
});
}

function resetGame(){

player={
x:canvas.width/2,
y:canvas.height-90,
width:38,
height:38,
speed:6
};

bullets=[];
enemies=[];
coins=[];
powerups=[];
particles=[];

score=0;
coinCount=0;
lives=3;
level=1;

rapidFire=0;
shield=0;
megaShot=0;

updateHUD();
}

function startGame(){
resetGame();
running=true;
document.getElementById("screen").style.display="none";
requestAnimationFrame(gameLoop);
}

function gameOver(){

running=false;

document.getElementById("screen").innerHTML=`
<h1>💥 GAME OVER</h1>
<p>Score: ${score}</p>
<p>Coins: ${coinCount}</p>
<p>Level: ${level}</p>
<button onclick="startGame()">🔄 PLAY AGAIN</button>
`;

document.getElementById("screen").style.display="flex";
}

function updateHUD(){

document.getElementById("lives").textContent=lives;
document.getElementById("score").textContent=score;
document.getElementById("coins").textContent=coinCount;
document.getElementById("level").textContent=level;

let text=[];

if(rapidFire>0)text.push("⚡ Rapid Fire "+Math.ceil(rapidFire/60)+"s");
if(shield>0)text.push("🛡️ Shield");
if(megaShot>0)text.push("💥 Mega Shot");

document.getElementById("power").textContent=text.join("   ");
}

function shoot(){

let now=Date.now();

let delay=rapidFire>0?120:350;

if(now-lastShot<delay)return;

lastShot=now;

if(megaShot>0){

bullets.push({
x:player.x,
y:player.y-25,
speed:10,
size:9,
damage:3,
mega:true
});

}else{

bullets.push({
x:player.x,
y:player.y-25,
speed:11,
size:4,
damage:1
});

}
}

function spawnEnemy(){

let type=Math.floor(Math.random()*3);

let size=
type===0?22:
type===1?30:38;

let speed=
type===0?2.5+level*.15:
type===1?1.8+level*.12:
type===2?1.2+level*.1;

enemies.push({
x:30+Math.random()*(canvas.width-60),
y:-40,
size:size,
speed:speed,
type:type,
hp:type===2?3:1
});
}

function spawnCoin(){

coins.push({
x:25+Math.random()*(canvas.width-50),
y:-20,
speed:2,
angle:0
});
}

function spawnPowerup(){

let types=["rapid","shield","mega","health"];

powerups.push({
x:25+Math.random()*(canvas.width-50),
y:-30,
speed:2,
type:types[Math.floor(Math.random()*types.length)],
angle:0
});
}

function explosion(x,y){

for(let i=0;i<18;i++){

particles.push({
x:x,
y:y,
vx:(Math.random()-.5)*7,
vy:(Math.random()-.5)*7,
life:35+Math.random()*25,
size:2+Math.random()*4
});

}
}

function drawPlayer(){

ctx.save();

ctx.translate(player.x,player.y);

if(shield>0){

ctx.beginPath();
ctx.arc(0,0,32,0,Math.PI*2);
ctx.strokeStyle="#38bdf8";
ctx.lineWidth=4;
ctx.stroke();

}

ctx.fillStyle="#22d3ee";

ctx.beginPath();
ctx.moveTo(0,-25);
ctx.lineTo(-20,20);
ctx.lineTo(0,12);
ctx.lineTo(20,20);
ctx.closePath();
ctx.fill();

ctx.fillStyle="#fff";

ctx.beginPath();
ctx.arc(0,-7,6,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function drawEnemy(e){

ctx.save();

ctx.translate(e.x,e.y);

if(e.type===0)ctx.fillStyle="#ef4444";
if(e.type===1)ctx.fillStyle="#a855f7";
if(e.type===2)ctx.fillStyle="#f97316";

ctx.beginPath();

ctx.moveTo(0,e.size);
ctx.lineTo(-e.size,e.size/2);
ctx.lineTo(-e.size/2,-e.size/2);
ctx.lineTo(0,-e.size);
ctx.lineTo(e.size/2,-e.size/2);
ctx.lineTo(e.size,e.size/2);

ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawCoin(c){

ctx.save();

ctx.translate(c.x,c.y);
ctx.rotate(c.angle);

ctx.fillStyle="#facc15";

ctx.beginPath();
ctx.arc(0,0,10,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#854d0e";
ctx.font="bold 12px Arial";
ctx.textAlign="center";
ctx.fillText("$",0,4);

ctx.restore();
}

function drawPowerup(p){

ctx.save();

ctx.translate(p.x,p.y);
ctx.rotate(p.angle);

let color="#fff";

if(p.type==="rapid")color="#facc15";
if(p.type==="shield")color="#38bdf8";
if(p.type==="mega")color="#f97316";
if(p.type==="health")color="#22c55e";

ctx.fillStyle=color;

ctx.beginPath();
ctx.arc(0,0,15,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";

ctx.font="bold 14px Arial";
ctx.textAlign="center";

let symbol=
p.type==="rapid"?"⚡":
p.type==="shield"?"🛡":
p.type==="mega"?"💥":"❤";

ctx.fillText(symbol,0,5);

ctx.restore();
}

function update(){

/* STARS */

for(let s of stars){

s.y+=s.speed;

if(s.y>canvas.height)s.y=0;

}

/* LEVEL */

level=Math.floor(score/1000)+1;

/* ENEMIES */

enemyTimer++;

let spawnRate=Math.max(20,65-level*4);

if(enemyTimer>spawnRate){

spawnEnemy();
enemyTimer=0;

}

/* COINS */

coinTimer++;

if(coinTimer>90){

spawnCoin();
coinTimer=0;

}

/* POWERUPS */

powerTimer++;

if(powerTimer>500){

spawnPowerup();
powerTimer=0;

}

/* PLAYER */

if(keys.left)player.x-=player.speed;
if(keys.right)player.x+=player.speed;

player.x=Math.max(25,Math.min(canvas.width-25,player.x));

if(firing)shoot();

/* BULLETS */

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];

b.y-=b.speed;

if(b.y<0){

bullets.splice(i,1);
continue;

}

/* BULLET COLLISION */

for(let j=enemies.length-1;j>=0;j--){

let e=enemies[j];

let dx=b.x-e.x;
let dy=b.y-e.y;

if(Math.sqrt(dx*dx+dy*dy)<e.size+b.size){

e.hp-=b.damage;

bullets.splice(i,1);

if(e.hp<=0){

score+=100;

explosion(e.x,e.y);

enemies.splice(j,1);

}

break;

}

}

}

/* ENEMIES */

for(let i=enemies.length-1;i>=0;i--){

let e=enemies[i];

e.y+=e.speed;

let dx=e.x-player.x;
let dy=e.y-player.y;

if(Math.sqrt(dx*dx+dy*dy)<e.size+22){

explosion(e.x,e.y);
enemies.splice(i,1);

if(shield>0){

shield=0;

}else{

lives--;

if(lives<=0){

gameOver();
return;

}

}

}

else if(e.y>canvas.height+50){

enemies.splice(i,1);

}

}

/* COINS */

for(let i=coins.length-1;i>=0;i--){

let c=coins[i];

c.y+=c.speed;
c.angle+=.08;

let dx=c.x-player.x;
let dy=c.y-player.y;

if(Math.sqrt(dx*dx+dy*dy)<30){

coinCount++;
score+=50;

explosion(c.x,c.y);

coins.splice(i,1);

}

else if(c.y>canvas.height){

coins.splice(i,1);

}

}

/* POWERUPS */

for(let i=powerups.length-1;i>=0;i--){

let p=powerups[i];

p.y+=p.speed;
p.angle+=.05;

let dx=p.x-player.x;
let dy=p.y-player.y;

if(Math.sqrt(dx*dx+dy*dy)<35){

if(p.type==="rapid")rapidFire=600;
if(p.type==="shield")shield=1;
if(p.type==="mega")megaShot=600;

if(p.type==="health"){

lives=Math.min(3,lives+1);

}

explosion(p.x,p.y);

powerups.splice(i,1);

}

else if(p.y>canvas.height){

powerups.splice(i,1);

}

}

/* POWER TIMERS */

if(rapidFire>0)rapidFire--;
if(megaShot>0)megaShot--;

/* PARTICLES */

for(let i=particles.length-1;i>=0;i--){

let p=particles[i];

p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<=0)particles.splice(i,1);

}

updateHUD();
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

/* BACKGROUND */

ctx.fillStyle="#020617";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* STARS */

ctx.fillStyle="white";

for(let s of stars){

ctx.fillRect(s.x,s.y,s.size,s.size);

}

/* BULLETS */

for(let b of bullets){

ctx.fillStyle=b.mega?"#f97316":"#67e8f9";

ctx.beginPath();
ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
ctx.fill();

}

/* OBJECTS */

for(let e of enemies)drawEnemy(e);
for(let c of coins)drawCoin(c);
for(let p of powerups)drawPowerup(p);

for(let p of particles){

ctx.globalAlpha=Math.max(0,p.life/50);
ctx.fillStyle="#fbbf24";

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();

}

ctx.globalAlpha=1;

drawPlayer();
}

function gameLoop(){

if(!running)return;

update();
draw();

requestAnimationFrame(gameLoop);
}

/* CONTROLS */

let keys={
left:false,
right:false
};

const left=document.getElementById("left");
const right=document.getElementById("right");
const fire=document.getElementById("fire");

function hold(button,key){

button.addEventListener("touchstart",e=>{
e.preventDefault();
keys[key]=true;
});

button.addEventListener("touchend",e=>{
e.preventDefault();
keys[key]=false;
});

button.addEventListener("mousedown",()=>{
keys[key]=true;
});

button.addEventListener("mouseup",()=>{
keys[key]=false;
});

button.addEventListener("mouseleave",()=>{
keys[key]=false;
});
}

hold(left,"left");
hold(right,"right");

fire.addEventListener("touchstart",e=>{
e.preventDefault();
firing=true;
});

fire.addEventListener("touchend",e=>{
e.preventDefault();
firing=false;
});

fire.addEventListener("mousedown",()=>{
firing=true;
});

fire.addEventListener("mouseup",()=>{
firing=false;
});

document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")keys.left=true;
if(e.key==="ArrowRight")keys.right=true;
if(e.code==="Space")firing=true;

});

document.addEventListener("keyup",e=>{

if(e.key==="ArrowLeft")keys.left=false;
if(e.key==="ArrowRight")keys.right=false;
if(e.code==="Space")firing=false;

});

</script>

</body>
</html>
