<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SPACE SHOOTER</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020617;
font-family:Arial,sans-serif;
touch-action:none;
}

canvas{
display:block;
width:100%;
height:100%;
}

#hud{
position:fixed;
top:0;
left:0;
right:0;
z-index:5;

display:flex;
justify-content:space-around;

padding:14px 5px;

color:white;
font-weight:bold;
font-size:15px;

background:linear-gradient(
rgba(0,0,0,.8),
transparent
);
}

.screen{
position:fixed;
inset:0;
z-index:10;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;

background:
radial-gradient(
circle at center,
rgba(10,50,120,.5),
rgba(0,0,0,.95)
);

color:white;
}

.hidden{
display:none!important;
}

.logo{
font-size:clamp(38px,11vw,75px);
font-weight:900;
color:#55d9ff;

text-shadow:
0 0 10px #00bfff,
0 0 30px #0077ff,
0 0 60px #0044ff;

margin-bottom:10px;
}

.subtitle{
letter-spacing:5px;
opacity:.8;
margin-bottom:35px;
}

.gameButton{
width:220px;
padding:16px;
margin:8px;

border:2px solid #20d9ff;
border-radius:12px;

background:linear-gradient(
#0878ff,
#0648b8
);

color:white;
font-size:19px;
font-weight:bold;

box-shadow:
0 0 20px rgba(0,180,255,.5);
}

.gameButton:active{
transform:scale(.95);
}

#controls{
position:fixed;
z-index:6;

left:0;
right:0;
bottom:20px;

display:flex;
justify-content:space-between;

padding:0 25px;

pointer-events:none;
}

.controlButton{
width:70px;
height:70px;

border-radius:50%;

border:2px solid rgba(255,255,255,.5);

background:rgba(0,50,110,.7);

color:white;

font-size:28px;
font-weight:bold;

pointer-events:auto;
}

#fireButton{
background:rgba(0,130,255,.8);
}

#gameOverScreen h2{
color:#ff4050;
font-size:45px;

text-shadow:
0 0 20px red;
}

.finalScore{
font-size:25px;
margin:20px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

<div>❤️ <span id="lives">3</span></div>

<div>🏆 <span id="score">0</span></div>

<div>🪙 <span id="coins">0</span></div>

<div>⭐ LV <span id="level">1</span></div>

</div>


<div id="startScreen" class="screen">

<div class="logo">
SPACE SHOOTER
</div>

<div class="subtitle">
GALACTIC BATTLE
</div>

<button
class="gameButton"
id="startButton">
▶ PLAY
</button>

</div>


<div
id="gameOverScreen"
class="screen hidden">

<h2>GAME OVER</h2>

<div class="finalScore">
Score:
<span id="finalScore">0</span>
</div>

<button
class="gameButton"
id="restartButton">
🔄 RETRY
</button>

</div>


<div id="controls">

<button
class="controlButton"
id="leftButton">
◀
</button>

<button
class="controlButton"
id="fireButton">
🔥
</button>

<button
class="controlButton"
id="rightButton">
▶
</button>

</div>


<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


function resizeCanvas(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* GAME */

let gameRunning=false;
let score=0;
let coins=0;
let lives=3;
let level=1;

let lastTime=0;
let enemyTimer=0;
let coinTimer=0;
let fireTimer=0;


/* PLAYER */

const player={

x:0,
y:0,

width:42,
height:55,

speed:330,

movingLeft:false,
movingRight:false,
firing:false

};


/* OBJECTS */

const bullets=[];
const enemies=[];
const coinObjects=[];
const stars=[];
const explosions=[];


/* STARS */

function createStars(){

stars.length=0;

for(let i=0;i<110;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*2+1,

speed:Math.random()*100+30

});

}

}


/* PLAYER RESET */

function resetPlayer(){

player.x=
canvas.width/2;

player.y=
canvas.height-120;

}


/* START */

function startGame(){

gameRunning=true;

score=0;
coins=0;
lives=3;
level=1;

bullets.length=0;
enemies.length=0;
coinObjects.length=0;
explosions.length=0;

enemyTimer=0;
coinTimer=1;
fireTimer=0;

resetPlayer();

updateHUD();

document
.getElementById("startScreen")
.classList.add("hidden");

document
.getElementById("gameOverScreen")
.classList.add("hidden");

}


/* GAME OVER */

function gameOver(){

gameRunning=false;

document
.getElementById("finalScore")
.textContent=score;

document
.getElementById("gameOverScreen")
.classList.remove("hidden");

}


/* HUD */

function updateHUD(){

document
.getElementById("score")
.textContent=score;

document
.getElementById("coins")
.textContent=coins;

document
.getElementById("lives")
.textContent=lives;

document
.getElementById("level")
.textContent=level;

}


/* PLAYER */

function drawPlayer(){

ctx.save();

ctx.translate(
player.x,
player.y
);

ctx.shadowColor="#00c8ff";
ctx.shadowBlur=25;

ctx.fillStyle="#36cfff";

ctx.beginPath();

ctx.moveTo(
0,
-player.height/2
);

ctx.lineTo(
-player.width/2,
player.height/2
);

ctx.lineTo(
0,
player.height/3
);

ctx.lineTo(
player.width/2,
player.height/2
);

ctx.closePath();

ctx.fill();


ctx.shadowBlur=10;

ctx.fillStyle="#fff";

ctx.beginPath();

ctx.arc(
0,
2,
7,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#ff8a00";

ctx.beginPath();

ctx.moveTo(-8,20);

ctx.lineTo(
0,
38+Math.random()*8
);

ctx.lineTo(8,20);

ctx.closePath();

ctx.fill();

ctx.restore();

}


/* SHOOT */

function shoot(){

bullets.push({

x:player.x,

y:player.y-30,

width:5,

height:18,

speed:650

});

}


/* BULLET */

function drawBullet(bullet){

ctx.save();

ctx.shadowColor="#00ffff";
ctx.shadowBlur=15;

ctx.fillStyle="#7df9ff";

ctx.fillRect(

bullet.x-bullet.width/2,
bullet.y,
bullet.width,
bullet.height

);

ctx.restore();

}


/* ENEMY */

function spawnEnemy(){

const type=
Math.floor(Math.random()*3);

let size=42;
let color="#ff3155";
let speed=
100+level*18;

if(type===1){

size=55;
color="#ff7b00";
speed=
80+level*15;

}

if(type===2){

size=32;
color="#c23cff";
speed=
150+level*25;

}

enemies.push({

x:
30+
Math.random()*
(canvas.width-60),

y:-60,

width:size,
height:size,

speed:speed,

color:color

});

}


/* ENEMY DRAW */

function drawEnemy(enemy){

ctx.save();

ctx.translate(
enemy.x,
enemy.y
);

ctx.shadowColor=
enemy.color;

ctx.shadowBlur=20;

ctx.fillStyle=
enemy.color;

ctx.beginPath();

ctx.moveTo(
0,
enemy.height/2
);

ctx.lineTo(
-enemy.width/2,
-enemy.height/3
);

ctx.lineTo(
-10,
-enemy.height/2
);

ctx.lineTo(
0,
-5
);

ctx.lineTo(
10,
-enemy.height/2
);

ctx.lineTo(
enemy.width/2,
-enemy.height/3
);

ctx.closePath();

ctx.fill();

ctx.restore();

}


/* COIN */

function spawnCoin(){

coinObjects.push({

x:
30+
Math.random()*
(canvas.width-60),

y:-30,

radius:13,

speed:
100+level*12,

rotation:0

});

}


/* DRAW COIN */

function drawCoin(coin){

ctx.save();

ctx.translate(
coin.x,
coin.y
);

ctx.rotate(
coin.rotation
);

ctx.shadowColor="#ffd700";
ctx.shadowBlur=20;

ctx.strokeStyle="#ffd700";
ctx.lineWidth=6;

ctx.beginPath();

ctx.arc(
0,
0,
coin.radius,
0,
Math.PI*2
);

ctx.stroke();

ctx.fillStyle="#fff176";

ctx.font="bold 15px Arial";

ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
"$",
0,
1
);

ctx.restore();

}


/* COLLISION */

function hit(a,b){

return(

a.x<
b.x+b.width/2 &&

a.x+a.width>
b.x-b.width/2 &&

a.y<
b.y+b.height/2 &&

a.y+a.height>
b.y-b.height/2

);

}


/* COIN COLLISION */

function collectCoin(coin){

const dx=
player.x-coin.x;

const dy=
player.y-coin.y;

return Math.sqrt(
dx*dx+dy*dy
)<35;

}


/* EXPLOSION */

function explode(x,y){

for(let i=0;i<14;i++){

explosions.push({

x:x,
y:y,

vx:
(Math.random()-.5)*250,

vy:
(Math.random()-.5)*250,

life:.6,

size:
Math.random()*5+2

});

}

}


/* UPDATE */

function update(delta){

/* STARS */

for(const star of stars){

star.y+=
star.speed*delta;

if(star.y>canvas.height){

star.y=0;

star.x=
Math.random()*canvas.width;

}

}


if(!gameRunning)
return;


/* PLAYER */

if(player.movingLeft)
player.x-=
player.speed*delta;

if(player.movingRight)
player.x+=
player.speed*delta;

player.x=Math.max(
25,
Math.min(
canvas.width-25,
player.x
)
);


/* FIRE */

if(
player.firing &&
fireTimer<=0
){

shoot();

fireTimer=.18;

}

fireTimer-=delta;


/* BULLETS */

for(
let i=bullets.length-1;
i>=0;
i--
){

const bullet=
bullets[i];

bullet.y-=
bullet.speed*delta;

if(bullet.y<-30){

bullets.splice(i,1);

}

}


/* ENEMIES */

enemyTimer-=delta;

if(enemyTimer<=0){

spawnEnemy();

enemyTimer=
Math.max(
.35,
1-level*.06
);

}


/* COINS */

coinTimer-=delta;

if(coinTimer<=0){

spawnCoin();

coinTimer=
1.2+
Math.random()*1.5;

}


/* ENEMY MOVEMENT */

for(
let i=enemies.length-1;
i>=0;
i--
){

const enemy=
enemies[i];

enemy.y+=
enemy.speed*delta;


const playerBox={

x:
player.x-player.width/2,

y:
player.y-player.height/2,

width:
player.width,

height:
player.height

};


if(hit(playerBox,enemy)){

explode(
enemy.x,
enemy.y
);

enemies.splice(i,1);

lives--;

updateHUD();

if(lives<=0){

gameOver();

return;

}

continue;

}


if(enemy.y>
canvas.height+70){

enemies.splice(i,1);

}

}


/* BULLET HIT */

for(
let b=bullets.length-1;
b>=0;
b--
){

const bullet=
bullets[b];

let removed=false;

for(
let e=enemies.length-1;
e>=0;
e--
){

const enemy=
enemies[e];

if(hit(bullet,enemy)){

explode(
enemy.x,
enemy.y
);

bullets.splice(b,1);
enemies.splice(e,1);

score+=100;

level=
Math.floor(score/1000)+1;

updateHUD();

removed=true;

break;

}

}

if(removed)
continue;

}


/* COINS */

for(
let i=coinObjects.length-1;
i>=0;
i--
){

const coin=
coinObjects[i];

coin.y+=
coin.speed*delta;

coin.rotation+=
delta*5;


if(
collectCoin(coin)
){

coins++;

score+=50;

updateHUD();

explode(
coin.x,
coin.y
);

coinObjects.splice(i,1);

continue;

}


if(
coin.y>
canvas.height+40
){

coinObjects.splice(i,1);

}

}


/* EXPLOSIONS */

for(
let i=explosions.length-1;
i>=0;
i--
){

const p=
explosions[i];

p.x+=p.vx*delta;
p.y+=p.vy*delta;

p.life-=delta;

if(p.life<=0){

explosions.splice(i,1);

}

}

}


/* DRAW */

function draw(){

ctx.fillStyle="#020617";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* STARS */

for(const star of stars){

ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.fillRect(
star.x,
star.y,
star.size,
star.size
);

}


if(gameRunning){

for(const bullet of bullets)
drawBullet(bullet);

for(const enemy of enemies)
drawEnemy(enemy);

for(const coin of coinObjects)
drawCoin(coin);

drawPlayer();

}


/* EXPLOSIONS */

for(const p of explosions){

ctx.save();

ctx.globalAlpha=
Math.max(0,p.life);

ctx.fillStyle=
"#ffcc00";

ctx.shadowColor=
"#ff6600";

ctx.shadowBlur=20;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}

}


/* LOOP */

function gameLoop(time){

const delta=
Math.min(
(time-lastTime)/1000,
.05
);

lastTime=time;

update(delta);
draw();

requestAnimationFrame(
gameLoop
);

}


/* BUTTONS */

document
.getElementById("startButton")
.onclick=startGame;

document
.getElementById("restartButton")
.onclick=startGame;


/* LEFT */

const leftButton=
document.getElementById(
"leftButton"
);

leftButton.onpointerdown=()=>{
player.movingLeft=true;
};

leftButton.onpointerup=()=>{
player.movingLeft=false;
};

leftButton.onpointerleave=()=>{
player.movingLeft=false;
};


/* RIGHT */

const rightButton=
document.getElementById(
"rightButton"
);

rightButton.onpointerdown=()=>{
player.movingRight=true;
};

rightButton.onpointerup=()=>{
player.movingRight=false;
};

rightButton.onpointerleave=()=>{
player.movingRight=false;
};


/* FIRE */

const fireButton=
document.getElementById(
"fireButton"
);

fireButton.onpointerdown=()=>{
player.firing=true;
};

fireButton.onpointerup=()=>{
player.firing=false;
};

fireButton.onpointerleave=()=>{
player.firing=false;
};


/* KEYBOARD */

window.addEventListener(
"keydown",
event=>{

if(event.key==="ArrowLeft")
player.movingLeft=true;

if(event.key==="ArrowRight")
player.movingRight=true;

if(event.code==="Space")
player.firing=true;

});


window.addEventListener(
"keyup",
event=>{

if(event.key==="ArrowLeft")
player.movingLeft=false;

if(event.key==="ArrowRight")
player.movingRight=false;

if(event.code==="Space")
player.firing=false;

});


/* START */

createStars();

resetPlayer();

requestAnimationFrame(
gameLoop
);

</script>

</body>
</html>
