<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Space Shooter X</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    margin:auto;
    background:#020617;
    max-width:100vw;
    max-height:100vh;
}

#hud{
    position:fixed;
    top:7px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    z-index:5;
    font-size:13px;
    font-weight:bold;
    pointer-events:none;
}

#power{
    position:fixed;
    top:31px;
    left:0;
    width:100%;
    text-align:center;
    font-size:12px;
    color:#facc15;
    z-index:5;
    pointer-events:none;
}

#bossBar{
    position:fixed;
    top:50px;
    left:10%;
    width:80%;
    height:12px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    z-index:5;
    display:none;
}

#bossHealth{
    height:100%;
    width:100%;
    background:#ef4444;
    transition:width .1s;
}

#bossText{
    position:fixed;
    top:64px;
    left:0;
    width:100%;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    z-index:5;
    display:none;
}

#screen{
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(2,6,23,.93);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

#screen h1{
    font-size:34px;
    margin:8px;
}

#screen h2{
    font-size:24px;
    margin:8px;
}

#screen p{
    margin:7px;
    font-size:15px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 22px;
    margin:6px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#pauseButton{
    position:fixed;
    top:82px;
    right:8px;
    z-index:8;
    padding:7px 11px;
    font-size:14px;
}

#controls{
    position:fixed;
    bottom:14px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    z-index:8;
}

.control{
    width:75px;
    height:55px;
    padding:0;
    font-size:25px;
    opacity:.85;
}

</style>
</head>

<body>

<div id="hud">
    <div>❤️ <span id="lives">3</span></div>
    <div>🏆 <span id="score">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>⭐ L<span id="level">1</span></div>
    <div>🏅 <span id="high">0</span></div>
</div>

<div id="power"></div>

<div id="bossBar">
    <div id="bossHealth"></div>
</div>

<div id="bossText">👹 BOSS</div>

<button id="pauseButton" onclick="togglePause()">⏸️</button>

<canvas id="game" width="400" height="700"></canvas>

<div id="screen">

    <h1>🚀 SPACE SHOOTER X</h1>

    <h2>GALAXY BATTLE</h2>

    <p>Destroy enemies. Collect coins. Survive the bosses.</p>

    <p>⚡ 🛡️ 💥 ❤️</p>

    <button onclick="startGame()">🚀 START GAME</button>

</div>

<div id="controls">

    <button class="control" id="left">⬅️</button>

    <button class="control" id="fire">🔥</button>

    <button class="control" id="right">➡️</button>

</div>

<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const W=canvas.width;
const H=canvas.height;


/* =========================
   GAME VARIABLES
========================= */

let player;

let bullets=[];
let enemyBullets=[];
let enemies=[];
let coins=[];
let powerups=[];
let particles=[];
let stars=[];

let boss=null;

let score=0;
let coinCount=0;
let lives=3;
let level=1;

let running=false;
let paused=false;
let firing=false;

let rapidFire=0;
let megaShot=0;
let shield=0;

let enemyTimer=0;
let coinTimer=0;
let powerTimer=0;
let bonusCoinTimer=0;

let lastShot=0;

let levelMessage=0;
let levelMessageText="";

let bossDefeated=false;

let highScore=
Number(localStorage.getItem("spaceShooterHighScore"))||0;


/* =========================
   STARS
========================= */

for(let i=0;i<100;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        speed:1+Math.random()*3,
        size:1+Math.random()*2
    });

}


/* =========================
   SOUND
========================= */

let audioCtx=null;

function sound(freq,duration,type="square"){

    try{

        if(!audioCtx){

            audioCtx=
            new(window.AudioContext||window.webkitAudioContext)();

        }

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        let osc=audioCtx.createOscillator();
        let gain=audioCtx.createGain();

        osc.type=type;
        osc.frequency.value=freq;

        gain.gain.setValueAtTime(.08,audioCtx.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duration);

    }catch(e){}

}


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("lives").textContent=lives;
    document.getElementById("score").textContent=score;
    document.getElementById("coins").textContent=coinCount;
    document.getElementById("level").textContent=level;
    document.getElementById("high").textContent=highScore;

    let text=[];

    if(rapidFire>0) text.push("⚡ Rapid Fire");
    if(shield>0) text.push("🛡 Shield");
    if(megaShot>0) text.push("💥 Mega Shot");

    document.getElementById("power").textContent=text.join("   ");

}


/* =========================
   RESET
========================= */

function resetGame(){

    player={
        x:W/2,
        y:H-90,
        speed:6
    };

    bullets=[];
    enemyBullets=[];
    enemies=[];
    coins=[];
    powerups=[];
    particles=[];

    boss=null;

    score=0;
    coinCount=0;
    lives=3;
    level=1;

    rapidFire=0;
    megaShot=0;
    shield=0;

    enemyTimer=0;
    coinTimer=0;
    powerTimer=0;
    bonusCoinTimer=0;

    lastShot=0;

    levelMessage=0;
    levelMessageText="";

    bossDefeated=false;

    document.getElementById("bossBar").style.display="none";
    document.getElementById("bossText").style.display="none";

    updateHUD();

}


/* =========================
   START
========================= */

function startGame(){

    resetGame();

    running=true;
    paused=false;

    document.getElementById("screen").style.display="none";

    sound(500,.12);

    requestAnimationFrame(gameLoop);

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "spaceShooterHighScore",
            highScore
        );

    }

    document.getElementById("bossBar").style.display="none";
    document.getElementById("bossText").style.display="none";

    document.getElementById("screen").innerHTML=`

        <h1>💥 GAME OVER</h1>

        <p>🏆 Score: ${score}</p>

        <p>🪙 Coins: ${coinCount}</p>

        <p>⭐ Level: ${level}</p>

        <p>🏅 Best: ${highScore}</p>

        <button onclick="startGame()">
        🔄 PLAY AGAIN
        </button>

    `;

    document.getElementById("screen").style.display="flex";

    sound(100,.4,"sawtooth");

}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!running)return;

    paused=!paused;

    if(paused){

        document.getElementById("pauseButton").textContent="▶️";

        document.getElementById("screen").innerHTML=`

            <h1>⏸️ PAUSED</h1>

            <p>Your game is paused.</p>

            <button onclick="togglePause()">
            ▶️ RESUME
            </button>

        `;

        document.getElementById("screen").style.display="flex";

    }else{

        document.getElementById("pauseButton").textContent="⏸️";

        document.getElementById("screen").style.display="none";

        requestAnimationFrame(gameLoop);

    }

}


/* =========================
   SHOOT
========================= */

function shoot(){

    let now=Date.now();

    let delay=rapidFire>0 ? 105 : 330;

    if(now-lastShot<delay)return;

    lastShot=now;

    if(megaShot>0){

        bullets.push({
            x:player.x,
            y:player.y-30,
            speed:12,
            size:9,
            damage:3,
            mega:true
        });

    }else{

        bullets.push({
            x:player.x,
            y:player.y-30,
            speed:11,
            size:4,
            damage:1,
            mega:false
        });

    }

    sound(
        megaShot>0 ? 220 : 420,
        .05
    );

}


/* =========================
   NORMAL ENEMY
========================= */

function spawnEnemy(){

    /*
      RED BASIC = 65%
      PURPLE     = 30%
      ORANGE     = 5%
    */

    let roll=Math.random();

    let type;

    if(roll<.65){

        type=0;

    }else if(roll<.95){

        type=1;

    }else{

        type=2;

    }

    let size;
    let speed;
    let hp;

    if(type===0){

        /* BASIC ENEMY */

        size=20;
        speed=2.8+level*.12;
        hp=1;

    }else if(type===1){

        /* MEDIUM ENEMY */

        size=29;
        speed=2.0+level*.10;
        hp=2;

    }else{

        /* RARE ORANGE ENEMY */

        size=39;
        speed=1.25+level*.08;
        hp=3;

    }

    enemies.push({

        x:30+Math.random()*(W-60),

        y:-50,

        size:size,

        speed:speed,

        hp:hp,

        maxHp:hp,

        type:type

    });

}


/* =========================
   COINS
========================= */

function spawnCoin(){

    coins.push({

        x:25+Math.random()*(W-50),

        y:-20,

        speed:2,

        angle:0,

        value:1

    });

}


/* =========================
   BONUS COIN
========================= */

function spawnBonusCoin(){

    coins.push({

        x:25+Math.random()*(W-50),

        y:-20,

        speed:2.4,

        angle:0,

        value:5,

        bonus:true

    });

}


/* =========================
   POWERUP
========================= */

function spawnPowerup(){

    let types=[
        "rapid",
        "shield",
        "mega",
        "health"
    ];

    let type=
    types[Math.floor(Math.random()*types.length)];

    powerups.push({

        x:30+Math.random()*(W-60),

        y:-30,

        speed:1.7,

        angle:0,

        type:type

    });

}


/* =========================
   BOSS
========================= */

function spawnBoss(){

    boss={

        x:W/2,
        y:100,
        size:55,

        maxHp:35+level*5,
        hp:35+level*5,

        speed:2.2,

        direction:1,

        shotTimer:0

    };

    document.getElementById("bossBar").style.display="block";
    document.getElementById("bossText").style.display="block";

    sound(80,.6,"sawtooth");

}


/* =========================
   EXPLOSION
========================= */

function explosion(x,y,big=false){

    let amount=big ? 45 : 18;

    for(let i=0;i<amount;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*
            (big?10:7),

            vy:(Math.random()-.5)*
            (big?10:7),

            life:30+Math.random()*
            (big?45:25),

            size:2+Math.random()*
            (big?6:4)

        });

    }

    sound(big?70:150,big?.35:.12);

}


/* =========================
   LEVEL MESSAGE
========================= */

function showLevelMessage(text){

    levelMessageText=text;
    levelMessage=150;

}


/* =========================
   UPDATE
========================= */

function update(){

    /* STARS */

    for(let s of stars){

        s.y+=s.speed;

        if(s.y>H){
            s.y=0;
        }

    }


    /* LEVEL */

    let newLevel=
    Math.floor(score/1000)+1;

    if(newLevel>level){

        level=newLevel;

        showLevelMessage(
            "⭐ LEVEL "+level+"!"
        );

        sound(700,.18);

        /*
          BOSS EVERY 5 LEVELS
        */

        if(
            level%5===0 &&
            boss===null &&
            !bossDefeated
        ){

            spawnBoss();

        }

    }


    /* LEVEL MESSAGE TIMER */

    if(levelMessage>0){
        levelMessage--;
    }


    /* ENEMIES */

    enemyTimer++;

    let enemyRate=
    Math.max(22,65-level*3);

    if(enemyTimer>=enemyRate){

        /*
          Don't spawn normal enemies
          too heavily during boss battle.
        */

        if(!boss){

            spawnEnemy();

        }

        enemyTimer=0;

    }


    /* NORMAL COINS */

    coinTimer++;

    if(coinTimer>=100){

        spawnCoin();

        coinTimer=0;

    }


    /* RARE BONUS COINS */

    bonusCoinTimer++;

    if(bonusCoinTimer>=
       1900+Math.random()*900){

        spawnBonusCoin();

        bonusCoinTimer=0;

    }


    /* RARE POWERUPS */

    powerTimer++;

    if(powerTimer>=
       1500+Math.random()*600){

        spawnPowerup();

        powerTimer=0;

    }


    /* PLAYER MOVEMENT */

    if(keys.left){
        player.x-=player.speed;
    }

    if(keys.right){
        player.x+=player.speed;
    }

    player.x=Math.max(
        25,
        Math.min(W-25,player.x)
    );


    /* SHOOTING */

    if(firing){
        shoot();
    }


    /* PLAYER BULLETS */

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.y-=b.speed;

        if(b.y<0){

            bullets.splice(i,1);

            continue;

        }


        /* BOSS HIT */

        if(boss){

            let dx=b.x-boss.x;
            let dy=b.y-boss.y;

            let distance=
            Math.sqrt(dx*dx+dy*dy);

            if(
                distance<
                boss.size+b.size
            ){

                boss.hp-=b.damage;

                bullets.splice(i,1);

                explosion(
                    b.x,
                    b.y,
                    false
                );

                if(boss.hp<=0){

                    explosion(
                        boss.x,
                        boss.y,
                        true
                    );

                    score+=1000;

                    coinCount+=10;

                    boss=null;

                    bossDefeated=true;

                    document.getElementById(
                        "bossBar"
                    ).style.display="none";

                    document.getElementById(
                        "bossText"
                    ).style.display="none";

                    showLevelMessage(
                        "🏆 BOSS DEFEATED! +1000"
                    );

                    sound(60,.8,"sawtooth");

                }

                continue;

            }

        }


        /* NORMAL ENEMY HIT */

        for(let j=enemies.length-1;j>=0;j--){

            let e=enemies[j];

            let dx=b.x-e.x;
            let dy=b.y-e.y;

            let distance=
            Math.sqrt(dx*dx+dy*dy);

            if(
                distance<
                e.size+b.size
            ){

                e.hp-=b.damage;

                bullets.splice(i,1);

                explosion(
                    b.x,
                    b.y,
                    false
                );

                if(e.hp<=0){

                    score+=100;

                    explosion(
                        e.x,
                        e.y,
                        e.type===2
                    );

                    enemies.splice(j,1);

                }

                break;

            }

        }

    }


    /* BOSS MOVEMENT */

    if(boss){

        boss.x+=
        boss.speed*
        boss.direction;

        if(
            boss.x<boss.size ||
            boss.x>W-boss.size
        ){

            boss.direction*=-1;

        }


        boss.shotTimer++;

        if(boss.shotTimer>=75){

            enemyBullets.push({

                x:boss.x,

                y:boss.y+boss.size,

                speed:4,

                size:7,

                damage:1

            });

            boss.shotTimer=0;

            sound(120,.07);

        }


        let healthPercent=
        Math.max(
            0,
            boss.hp/boss.maxHp
        )*100;

        document.getElementById(
            "bossHealth"
        ).style.width=
        healthPercent+"%";

    }


    /* ENEMIES */

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.y+=e.speed;

        let dx=e.x-player.x;
        let dy=e.y-player.y;

        let distance=
        Math.sqrt(dx*dx+dy*dy);

        if(
            distance<
            e.size+22
        ){

            explosion(
                e.x,
                e.y,
                e.type===2
            );

            enemies.splice(i,1);

            if(shield>0){

                shield=0;

                sound(700,.12);

            }else{

                lives--;

                sound(100,.25);

                if(lives<=0){

                    gameOver();

                    return;

                }

            }

        }else if(e.y>H+60){

            enemies.splice(i,1);

        }

    }


    /* ENEMY BULLETS */

    for(let i=enemyBullets.length-1;i>=0;i--){

        let b=enemyBullets[i];

        b.y+=b.speed;

        if(b.y>H+30){

            enemyBullets.splice(i,1);

            continue;

        }

        let dx=b.x-player.x;
        let dy=b.y-player.y;

        let distance=
        Math.sqrt(dx*dx+dy*dy);

        if(distance<25){

            enemyBullets.splice(i,1);

            if(shield>0){

                shield=0;

                sound(700,.12);

            }else{

                lives--;

                explosion(
                    player.x,
                    player.y,
                    false
                );

                sound(100,.25);

                if(lives<=0){

                    gameOver();

                    return;

                }

            }

        }

    }


    /* COINS */

    for(let i=coins.length-1;i>=0;i--){

        let c=coins[i];

        c.y+=c.speed;
        c.angle+=.08;

        let dx=c.x-player.x;
        let dy=c.y-player.y;

        if(
            Math.sqrt(dx*dx+dy*dy)<35
        ){

            coinCount+=c.value;

            score+=c.value*50;

            explosion(
                c.x,
                c.y,
                c.bonus
            );

            sound(
                c.bonus?900:700,
                .12
            );

            coins.splice(i,1);

        }else if(c.y>H+30){

            coins.splice(i,1);

        }

    }


    /* POWERUPS */

    for(let i=powerups.length-1;i>=0;i--){

        let p=powerups[i];

        p.y+=p.speed;
        p.angle+=.05;

        let dx=p.x-player.x;
        let dy=p.y-player.y;

        if(
            Math.sqrt(dx*dx+dy*dy)<38
        ){

            if(p.type==="rapid"){

                rapidFire=600;

            }

            if(p.type==="shield"){

                shield=1;

            }

            if(p.type==="mega"){

                megaShot=600;

            }

            if(p.type==="health"){

                lives=Math.min(
                    3,
                    lives+1
                );

            }

            explosion(
                p.x,
                p.y,
                true
            );

            sound(800,.15);

            powerups.splice(i,1);

        }else if(p.y>H+40){

            powerups.splice(i,1);

        }

    }


    /* POWER TIMERS */

    if(rapidFire>0){
        rapidFire--;
    }

    if(megaShot>0){
        megaShot--;
    }


    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }


    updateHUD();

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /* SHIELD */

    if(shield>0){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            35,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#38bdf8";
        ctx.lineWidth=4;

        ctx.stroke();

    }


    /* SHIP */

    ctx.fillStyle="#22d3ee";

    ctx.beginPath();

    ctx.moveTo(0,-27);

    ctx.lineTo(-21,21);

    ctx.lineTo(0,12);

    ctx.lineTo(21,21);

    ctx.closePath();

    ctx.fill();


    /* WINDOW */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        0,
        -7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ENGINE */

    ctx.fillStyle="#f97316";

    ctx.beginPath();

    ctx.moveTo(-8,19);

    ctx.lineTo(0,31);

    ctx.lineTo(8,19);

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================
   DRAW ENEMY
========================= */

function drawEnemy(e){

    ctx.save();

    ctx.translate(e.x,e.y);


    if(e.type===0){

        /* BASIC RED ENEMY */

        ctx.fillStyle="#ef4444";

        ctx.beginPath();

        ctx.moveTo(0,e.size);

        ctx.lineTo(-e.size,e.size/2);

        ctx.lineTo(-e.size/2,-e.size/2);

        ctx.lineTo(0,-e.size);

        ctx.lineTo(e.size/2,-e.size/2);

        ctx.lineTo(e.size,e.size/2);

        ctx.closePath();

        ctx.fill();

    }


    if(e.type===1){

        /* PURPLE ENEMY */

        ctx.fillStyle="#a855f7";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            e.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    if(e.type===2){

        /* RARE ORANGE ENEMY */

        ctx.fillStyle="#f97316";

        ctx.beginPath();

        ctx.moveTo(
            0,
            e.size
        );

        ctx.lineTo(
            -e.size,
            e.size/2
        );

        ctx.lineTo(
            -e.size/2,
            -e.size/2
        );

        ctx.lineTo(
            0,
            -e.size
        );

        ctx.lineTo(
            e.size/2,
            -e.size/2
        );

        ctx.lineTo(
            e.size,
            e.size/2
        );

        ctx.closePath();

        ctx.fill();

    }


    /* EYES */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        -e.size*.35,
        0,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        e.size*.35,
        0,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   DRAW BOSS
========================= */

function drawBoss(){

    if(!boss)return;

    ctx.save();

    ctx.translate(
        boss.x,
        boss.y
    );


    ctx.fillStyle="#dc2626";

    ctx.beginPath();

    ctx.moveTo(0,-boss.size);

    ctx.lineTo(
        -boss.size,
        boss.size*.5
    );

    ctx.lineTo(
        -boss.size*.5,
        boss.size
    );

    ctx.lineTo(
        0,
        boss.size*.5
    );

    ctx.lineTo(
        boss.size*.5,
        boss.size
    );

    ctx.lineTo(
        boss.size,
        boss.size*.5
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(
        -20,
        0,
        7,
        0,
        Math.PI*2
    );

    ctx.arc(
        20,
        0,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================
   DRAW COIN
========================= */

function drawCoin(c){

    ctx.save();

    ctx.translate(
        c.x,
        c.y
    );

    ctx.rotate(c.angle);

    ctx.fillStyle=
    c.bonus ?
    "#f97316" :
    "#facc15";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        c.bonus?14:10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111827";

    ctx.font=
    c.bonus ?
    "bold 14px Arial" :
    "bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        c.bonus?"5":"$",
        0,
        5
    );

    ctx.restore();

}


/* =========================
   DRAW POWERUP
========================= */

function drawPowerup(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.rotate(p.angle);

    let color;
    let symbol;

    if(p.type==="rapid"){

        color="#facc15";
        symbol="⚡";

    }else if(p.type==="shield"){

        color="#38bdf8";
        symbol="🛡";

    }else if(p.type==="mega"){

        color="#f97316";
        symbol="💥";

    }else{

        color="#22c55e";
        symbol="♥";

    }

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111827";

    ctx.font="bold 17px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        symbol,
        0,
        6
    );

    ctx.restore();

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#020617";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* STARS */

    ctx.fillStyle="white";

    for(let s of stars){

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );

    }


    /* PLAYER BULLETS */

    for(let b of bullets){

        ctx.fillStyle=
        b.mega ?
        "#f97316" :
        "#67e8f9";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ENEMY BULLETS */

    for(let b of enemyBullets){

        ctx.fillStyle="#ef4444";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    for(let e of enemies){

        drawEnemy(e);

    }


    drawBoss();


    for(let c of coins){

        drawCoin(c);

    }


    for(let p of powerups){

        drawPowerup(p);

    }


    /* PARTICLES */

    for(let p of particles){

        ctx.globalAlpha=
        Math.max(
            0,
            p.life/50
        );

        ctx.fillStyle="#fbbf24";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    drawPlayer();


    /* LEVEL MESSAGE */

    if(levelMessage>0){

        ctx.save();

        ctx.globalAlpha=
        Math.min(
            1,
            levelMessage/30
        );

        ctx.fillStyle="white";

        ctx.textAlign="center";

        ctx.font="bold 30px Arial";

        ctx.fillText(
            levelMessageText,
            W/2,
            H/2
        );

        ctx.restore();

    }

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!running || paused)return;

    update();

    draw();

    requestAnimationFrame(gameLoop);

}


/* =========================
   CONTROLS
========================= */

let keys={
    left:false,
    right:false
};


function holdButton(button,key){

    button.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            keys[key]=true;

        },
        {passive:false}
    );


    button.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            keys[key]=false;

        },
        {passive:false}
    );


    button.addEventListener(
        "touchcancel",
        function(){

            keys[key]=false;

        }
    );


    button.addEventListener(
        "mousedown",
        function(){

            keys[key]=true;

        }
    );


    button.addEventListener(
        "mouseup",
        function(){

            keys[key]=false;

        }
    );


    button.addEventListener(
        "mouseleave",
        function(){

            keys[key]=false;

        }
    );

}


holdButton(
    document.getElementById("left"),
    "left"
);

holdButton(
    document.getElementById("right"),
    "right"
);


/* FIRE BUTTON */

const fireButton=
document.getElementById("fire");


fireButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        firing=true;

        shoot();

    },
    {passive:false}
);


fireButton.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        firing=false;

    },
    {passive:false}
);


fireButton.addEventListener(
    "touchcancel",
    function(){

        firing=false;

    }
);


fireButton.addEventListener(
    "mousedown",
    function(){

        firing=true;

        shoot();

    }
);


fireButton.addEventListener(
    "mouseup",
    function(){

        firing=false;

    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowLeft"){
            keys.left=true;
        }

        if(e.key==="ArrowRight"){
            keys.right=true;
        }

        if(e.code==="Space"){
            firing=true;
        }

        if(e.key==="p" || e.key==="P"){
            togglePause();
        }

    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.key==="ArrowLeft"){
            keys.left=false;
        }

        if(e.key==="ArrowRight"){
            keys.right=false;
        }

        if(e.code==="Space"){
            firing=false;
        }

    }
);


/* INITIAL HUD */

document.getElementById("high").textContent=highScore;

</script>
