<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#020617;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    touch-action:none;
}

canvas{
    display:block;
    margin:auto;
    background:#020617;
    max-width:100vw;
    max-height:100vh;
}

#hud{
    position:fixed;
    top:8px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    z-index:5;
    font-size:14px;
    font-weight:bold;
    pointer-events:none;
}

#powerStatus{
    position:fixed;
    top:34px;
    left:0;
    width:100%;
    text-align:center;
    z-index:5;
    font-size:13px;
    color:#facc15;
    pointer-events:none;
}

#screen{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(2,6,23,.90);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#screen h1{
    font-size:36px;
    margin:8px;
}

#screen p{
    font-size:16px;
    margin:8px;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 22px;
    margin:6px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#pauseButton{
    position:fixed;
    top:58px;
    right:8px;
    z-index:7;
    padding:8px 12px;
    font-size:14px;
}

#controls{
    position:fixed;
    bottom:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-around;
    z-index:6;
}

.control{
    width:75px;
    height:55px;
    padding:0;
    font-size:25px;
    opacity:.85;
}
</style>
</head>

<body>

<div id="hud">
    <div>❤️ <span id="lives">3</span></div>
    <div>🏆 <span id="score">0</span></div>
    <div>🪙 <span id="coins">0</span></div>
    <div>⭐ L<span id="level">1</span></div>
    <div>🏅 <span id="highScore">0</span></div>
</div>

<div id="powerStatus"></div>

<button id="pauseButton" onclick="togglePause()">⏸️</button>

<canvas id="game" width="400" height="700"></canvas>

<div id="screen">
    <h1>🚀 SPACE SHOOTER</h1>
    <p>Destroy enemies and collect power-ups!</p>
    <p>⚡ 🛡️ 💥 ❤️</p>
    <button onclick="startGame()">🚀 START GAME</button>
</div>

<div id="controls">
    <button class="control" id="left">⬅️</button>
    <button class="control" id="fire">🔥</button>
    <button class="control" id="right">➡️</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player;

let bullets = [];
let enemies = [];
let coins = [];
let powerups = [];
let particles = [];
let stars = [];

let score = 0;
let coinCount = 0;
let lives = 3;
let level = 1;

let running = false;
let paused = false;
let firing = false;

let rapidFire = 0;
let megaShot = 0;
let shield = 0;

let enemyTimer = 0;
let coinTimer = 0;
let powerTimer = 0;
let lastShot = 0;

let highScore = Number(localStorage.getItem("spaceHighScore")) || 0;

document.getElementById("highScore").textContent = highScore;


/* =========================
   STARS
========================= */

for(let i=0;i<100;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        speed:1+Math.random()*3,
        size:Math.random()*2+1
    });

}


/* =========================
   GAME RESET
========================= */

function resetGame(){

    player = {
        x:W/2,
        y:H-90,
        speed:6
    };

    bullets=[];
    enemies=[];
    coins=[];
    powerups=[];
    particles=[];

    score=0;
    coinCount=0;
    lives=3;
    level=1;

    rapidFire=0;
    megaShot=0;
    shield=0;

    enemyTimer=0;
    coinTimer=0;
    powerTimer=0;
    lastShot=0;

    updateHUD();
}


/* =========================
   START
========================= */

function startGame(){

    resetGame();

    running=true;
    paused=false;

    document.getElementById("screen").style.display="none";

    requestAnimationFrame(gameLoop);
}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "spaceHighScore",
            highScore
        );
    }

    document.getElementById("highScore").textContent=highScore;

    document.getElementById("screen").innerHTML=`

        <h1>💥 GAME OVER</h1>

        <p>🏆 Score: ${score}</p>

        <p>🪙 Coins: ${coinCount}</p>

        <p>⭐ Level: ${level}</p>

        <p>🏅 Best: ${highScore}</p>

        <button onclick="startGame()">🔄 PLAY AGAIN</button>
    `;

    document.getElementById("screen").style.display="flex";
}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!running)return;

    paused=!paused;

    if(paused){

        document.getElementById("pauseButton").textContent="▶️";

        document.getElementById("screen").innerHTML=`

            <h1>⏸️ PAUSED</h1>

            <p>Game paused</p>

            <button onclick="togglePause()">▶️ RESUME</button>
        `;

        document.getElementById("screen").style.display="flex";

    }else{

        document.getElementById("pauseButton").textContent="⏸️";

        document.getElementById("screen").style.display="none";

        requestAnimationFrame(gameLoop);
    }
}


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("lives").textContent=lives;

    document.getElementById("score").textContent=score;

    document.getElementById("coins").textContent=coinCount;

    document.getElementById("level").textContent=level;

    document.getElementById("highScore").textContent=highScore;

    let status=[];

    if(rapidFire>0)
        status.push("⚡ Rapid Fire");

    if(shield>0)
        status.push("🛡️ Shield");

    if(megaShot>0)
        status.push("💥 Mega Shot");

    document.getElementById("powerStatus").textContent=
        status.join("   ");
}


/* =========================
   SHOOT
========================= */

function shoot(){

    let now=Date.now();

    let delay = rapidFire>0 ? 110 : 330;

    if(now-lastShot<delay)return;

    lastShot=now;

    if(megaShot>0){

        bullets.push({
            x:player.x,
            y:player.y-28,
            speed:11,
            size:9,
            damage:3,
            mega:true
        });

    }else{

        bullets.push({
            x:player.x,
            y:player.y-28,
            speed:11,
            size:4,
            damage:1,
            mega:false
        });
    }
}


/* =========================
   ENEMIES
========================= */

function spawnEnemy(){

    let type=Math.floor(Math.random()*3);

    let size;
    let speed;
    let hp;

    if(type===0){

        size=20;
        speed=2.8+level*.12;
        hp=1;

    }else if(type===1){

        size=29;
        speed=1.9+level*.10;
        hp=1;

    }else{

        size=39;
        speed=1.25+level*.08;
        hp=3;
    }

    enemies.push({

        x:30+Math.random()*(W-60),
        y:-50,
        size:size,
        speed:speed,
        hp:hp,
        type:type
    });
}


/* =========================
   COINS
========================= */

function spawnCoin(){

    coins.push({

        x:25+Math.random()*(W-50),
        y:-20,
        speed:2,
        angle:0
    });
}


/* =========================
   POWER-UPS
========================= */

function spawnPowerup(){

    let types=["rapid","shield","mega","health"];

    let type=types[
        Math.floor(Math.random()*types.length)
    ];

    powerups.push({

        x:30+Math.random()*(W-60),
        y:-30,
        speed:1.7,
        angle:0,
        type:type
    });
}


/* =========================
   EXPLOSION
========================= */

function explosion(x,y){

    for(let i=0;i<18;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*7,
            vy:(Math.random()-.5)*7,

            life:35+Math.random()*25,

            size:2+Math.random()*4
        });
    }
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    ctx.save();

    ctx.translate(player.x,player.y);

    if(shield>0){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            34,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#38bdf8";
        ctx.lineWidth=4;

        ctx.stroke();
    }

    ctx.fillStyle="#22d3ee";

    ctx.beginPath();

    ctx.moveTo(0,-27);
    ctx.lineTo(-21,21);
    ctx.lineTo(0,12);
    ctx.lineTo(21,21);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(0,-7,6,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle="#f97316";

    ctx.beginPath();

    ctx.moveTo(-8,19);
    ctx.lineTo(0,31);
    ctx.lineTo(8,19);

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW ENEMY
========================= */

function drawEnemy(e){

    ctx.save();

    ctx.translate(e.x,e.y);

    if(e.type===0)
        ctx.fillStyle="#ef4444";

    if(e.type===1)
        ctx.fillStyle="#a855f7";

    if(e.type===2)
        ctx.fillStyle="#f97316";

    ctx.beginPath();

    ctx.moveTo(0,e.size);

    ctx.lineTo(-e.size,e.size/2);

    ctx.lineTo(-e.size/2,-e.size/2);

    ctx.lineTo(0,-e.size);

    ctx.lineTo(e.size/2,-e.size/2);

    ctx.lineTo(e.size,e.size/2);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        -e.size*.35,
        0,
        3,
        0,
        Math.PI*2
    );

    ctx.arc(
        e.size*.35,
        0,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW COIN
========================= */

function drawCoin(c){

    ctx.save();

    ctx.translate(c.x,c.y);

    ctx.rotate(c.angle);

    ctx.fillStyle="#facc15";

    ctx.beginPath();

    ctx.arc(0,0,10,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle="#854d0e";

    ctx.font="bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillText("$",0,4);

    ctx.restore();
}


/* =========================
   DRAW POWERUP
========================= */

function drawPowerup(p){

    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.rotate(p.angle);

    let color;

    let symbol;

    if(p.type==="rapid"){

        color="#facc15";
        symbol="⚡";

    }else if(p.type==="shield"){

        color="#38bdf8";
        symbol="🛡";

    }else if(p.type==="mega"){

        color="#f97316";
        symbol="💥";

    }else{

        color="#22c55e";
        symbol="♥";
    }

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(0,0,17,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle="#111827";

    ctx.font="bold 17px Arial";

    ctx.textAlign="center";

    ctx.fillText(symbol,0,6);

    ctx.restore();
}


/* =========================
   UPDATE
========================= */

function update(){

    /* STARS */

    for(let s of stars){

        s.y+=s.speed;

        if(s.y>H)
            s.y=0;
    }


    /* LEVEL */

    level=Math.floor(score/1000)+1;


    /* ENEMY SPAWN */

    enemyTimer++;

    let enemyRate=Math.max(
        22,
        65-level*3
    );

    if(enemyTimer>=enemyRate){

        spawnEnemy();

        enemyTimer=0;
    }


    /* COIN SPAWN */

    coinTimer++;

    if(coinTimer>=100){

        spawnCoin();

        coinTimer=0;
    }


    /*
       POWER-UPS ARE NOW RARE:
       roughly every 25-35 seconds
    */

    powerTimer++;

    if(powerTimer>=
        1500+Math.random()*600){

        spawnPowerup();

        powerTimer=0;
    }


    /* PLAYER */

    if(keys.left)
        player.x-=player.speed;

    if(keys.right)
        player.x+=player.speed;

    player.x=Math.max(
        25,
        Math.min(W-25,player.x)
    );

    if(firing)
        shoot();


    /* BULLETS */

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.y-=b.speed;

        if(b.y<0){

            bullets.splice(i,1);
            continue;
        }


        for(let j=enemies.length-1;j>=0;j--){

            let e=enemies[j];

            let dx=b.x-e.x;
            let dy=b.y-e.y;

            let distance=Math.sqrt(
                dx*dx+dy*dy
            );

            if(distance<e.size+b.size){

                e.hp-=b.damage;

                bullets.splice(i,1);

                if(e.hp<=0){

                    score+=100;

                    explosion(
                        e.x,
                        e.y
                    );

                    enemies.splice(j,1);
                }

                break;
            }
        }
    }


    /* ENEMIES */

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        e.y+=e.speed;

        let dx=e.x-player.x;
        let dy=e.y-player.y;

        let distance=Math.sqrt(
            dx*dx+dy*dy
        );

        if(distance<e.size+22){

            explosion(e.x,e.y);

            enemies.splice(i,1);

            if(shield>0){

                shield=0;

            }else{

                lives--;

                if(lives<=0){

                    gameOver();

                    return;
                }
            }

        }else if(e.y>H+60){

            enemies.splice(i,1);
        }
    }


    /* COINS */

    for(let i=coins.length-1;i>=0;i--){

        let c=coins[i];

        c.y+=c.speed;

        c.angle+=.08;

        let dx=c.x-player.x;
        let dy=c.y-player.y;

        if(Math.sqrt(dx*dx+dy*dy)<32){

            coinCount++;

            score+=50;

            explosion(c.x,c.y);

            coins.splice(i,1);

        }else if(c.y>H+30){

            coins.splice(i,1);
        }
    }


    /* POWER-UPS */

    for(let i=powerups.length-1;i>=0;i--){

        let p=powerups[i];

        p.y+=p.speed;

        p.angle+=.05;

        let dx=p.x-player.x;
        let dy=p.y-player.y;

        if(Math.sqrt(dx*dx+dy*dy)<38){

            if(p.type==="rapid")
                rapidFire=600;

            if(p.type==="shield")
                shield=1;

            if(p.type==="mega")
                megaShot=600;

            if(p.type==="health")
                lives=Math.min(3,lives+1);

            explosion(p.x,p.y);

            powerups.splice(i,1);

        }else if(p.y>H+40){

            powerups.splice(i,1);
        }
    }


    /* POWER-UP TIMERS */

    if(rapidFire>0)
        rapidFire--;

    if(megaShot>0)
        megaShot--;


    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.life--;

        if(p.life<=0)
            particles.splice(i,1);
    }


    updateHUD();
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* BACKGROUND */

    ctx.fillStyle="#020617";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* STARS */

    ctx.fillStyle="white";

    for(let s of stars){

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );
    }


    /* BULLETS */

    for(let b of bullets){

        ctx.fillStyle=
            b.mega
            ? "#f97316"
            : "#67e8f9";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* OBJECTS */

    for(let e of enemies)
        drawEnemy(e);

    for(let c of coins)
        drawCoin(c);

    for(let p of powerups)
        drawPowerup(p);


    /* PARTICLES */

    for(let p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life/50);

        ctx.fillStyle="#fbbf24";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    drawPlayer();
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!running || paused)
        return;

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


/* =========================
   CONTROLS
========================= */

let keys={
    left:false,
    right:false
};


function holdButton(button,key){

    button.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            keys[key]=true;
        }
    );

    button.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            keys[key]=false;
        }
    );

    button.addEventListener(
        "mousedown",
        function(){

            keys[key]=true;
        }
    );

    button.addEventListener(
        "mouseup",
        function(){

            keys[key]=false;
        }
    );

    button.addEventListener(
        "mouseleave",
        function(){

            keys[key]=false;
        }
    );
}


holdButton(
    document.getElementById("left"),
    "left"
);

holdButton(
    document.getElementById("right"),
    "right"
);


const fireButton=
    document.getElementById("fire");


fireButton.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        firing=true;
    }
);


fireButton.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();

        firing=false;
    }
);


fireButton.addEventListener(
    "mousedown",
    function(){

        firing=true;
    }
);


fireButton.addEventListener(
    "mouseup",
    function(){

        firing=false;
    }
);


/* KEYBOARD */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowLeft")
            keys.left=true;

        if(e.key==="ArrowRight")
            keys.right=true;

        if(e.code==="Space")
            firing=true;

        if(e.key==="p" || e.key==="P")
            togglePause();
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.key==="ArrowLeft")
            keys.left=false;

        if(e.key==="ArrowRight")
            keys.right=false;

        if(e.code==="Space")
            firing=false;
    }
);

</script>

</body>
</html>
